name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # One command for the whole project: the app compiles and every module's JVM tests run, so a
      # change that only breaks a feature module or a repository test fails here rather than on a
      # phone. Android's lint is not part of this (it needs a full SDK download and a baseline).
      - name: Build and test
        run: ./gradlew :app:assembleDebug testDebugUnitTest --console=plain --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
