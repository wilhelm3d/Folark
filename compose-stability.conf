// Compose stability (E30): Folark's model classes are immutable (val-only data classes, copied
// on change), so Compose may skip redrawing a composable whose model arguments are unchanged.
// Android types inside them (ComponentName, UserHandle, Drawable) are never mutated by Folark.
org.arkikeskus.launcher.model.**
org.arkikeskus.launcher.data.SplitApp
org.arkikeskus.launcher.data.OpenTask
// Read-only Kotlin collections passed to composables are never changed in place.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
